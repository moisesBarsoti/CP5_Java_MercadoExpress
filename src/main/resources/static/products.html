
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos - MercadoExpress</title>

    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/products.js?v=3" defer></script>
</head>
<body>

<header>
    <h1>MercadoExpress</h1>

    <nav>
        <a href="/index.html">Início</a>
        <a href="/products.html">Produtos</a>
        <a href="/login.html">Entrar</a>
        <a href="/register.html">Cadastrar</a>
    </nav>
</header>

<main class="products-container">

    <div class="products-header">
        <h2>Catálogo de produtos</h2>

        <button
                id="add-product-button"
                type="button"
                class="button"
                hidden>
            Novo produto
        </button>
    </div>

    <section id="admin-product-section" class="admin-panel" hidden>
        <h3 id="product-form-title">Cadastrar produto</h3>

        <form id="product-form">
            <label for="product-name">Nome</label>
            <input
                    id="product-name"
                    type="text"
                    required>

            <label for="product-price">Preço</label>
            <input
                    id="product-price"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required>

            <label for="product-stock">Quantidade em estoque</label>
            <input
                    id="product-stock"
                    type="number"
                    min="0"
                    step="1"
                    required>

            <div class="form-actions">
                <button class="button" type="submit">
                    Salvar produto
                </button>

                <button
                        id="cancel-product-button"
                        class="secondary-button"
                        type="button">
                    Cancelar
                </button>
            </div>
        </form>
    </section>

    <p id="action-message" role="status" aria-live="polite"></p>
    <p id="products-message" role="status" aria-live="polite">
        Carregando produtos...
    </p>

    <div id="products-list" class="products-grid"></div>

    <button id="refresh-products" class="button refresh-button" type="button">
        Atualizar catálogo
    </button>

    <p class="login-link-container">
        <a id="products-login-link" href="/login.html" hidden>
            Fazer login
        </a>
    </p>

</main>

<footer>
    <p>MercadoExpress © 2026</p>
</footer>

</body>
</html>
