
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: mercadoexpress-rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    container_name: mercadoexpress-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  mercadoexpress:
    image: mercadoexpress-api:1.0
    container_name: mercadoexpress-api
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://host.docker.internal:5432/mercado_express
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}

      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      BANK_API_BASE_URL: http://host.docker.internal:8081

      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

    depends_on:
      - rabbitmq
      - mailpit

volumes:
  rabbitmq_data:
